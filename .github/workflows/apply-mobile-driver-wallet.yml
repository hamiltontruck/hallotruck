name: Apply mobile Driver wallet

on:
  push:
    branches:
      - feat/mobile-driver-wallet
    paths:
      - ".github/workflows/apply-mobile-driver-wallet.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-wallet
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate Driver wallet
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile-app/src/App.tsx")
          text = path.read_text()
          anchor = 'import { DriverActiveTripView } from "./driver/DriverActiveTripView";'
          wallet_import = 'import { DriverWalletView } from "./driver/DriverWalletView";'
          if wallet_import not in text:
              if anchor not in text:
                  raise SystemExit("DriverActiveTripView import not found")
              text = text.replace(anchor, anchor + "\n" + wallet_import, 1)

          start = text.find('function WalletView({ role }: { role: Role }) {')
          end = text.find('\nfunction ProfileView(', start)
          if start < 0 or end < 0:
              raise SystemExit("WalletView block not found")

          customer = '''function CustomerPaymentsView() {
            const transactions = [["ORD-2026-0789", "ETB 18,750", "In transit"], ["ORD-2026-0756", "ETB 24,500", "Delivered"], ["ORD-2026-0741", "ETB 14,000", "Delivered"]];
            return <div className="space-y-5 px-4 pb-7 pt-5 sm:px-6">
              <div><p className="text-[10px] font-black uppercase tracking-[0.18em] text-halo-gold-dark">Payments</p><h1 className="mt-1 text-2xl font-black text-halo-navy">Kaffaltii fi invoice</h1></div>
              <section className="relative overflow-hidden rounded-[28px] bg-gradient-to-br from-halo-blue to-halo-blue-dark p-5 text-white shadow-halo-float"><div className="absolute -right-9 -top-9 h-32 w-32 rounded-full border-[24px] border-white/5"/><div className="relative"><p className="text-xs text-white/60">Total paid</p><p className="mt-2 text-3xl font-black tracking-tight">ETB 57,250</p><div className="mt-5 flex gap-2"><button type="button" className="min-h-11 flex-1 rounded-2xl bg-halo-gold px-4 text-xs font-black text-halo-navy">Invoice ilaali</button><button type="button" className="grid h-11 w-11 place-items-center rounded-2xl bg-white/12"><Icon name="arrow" className="h-4 w-4" /></button></div></div></section>
              <section className="space-y-3"><SectionTitle eyebrow="Recent activity" title="Galmee dhihoo" action="Hundaa" />{transactions.map(([title, amount, status]) => <article key={title} className="flex items-center gap-3 rounded-[20px] border border-halo-line bg-white p-3.5 shadow-halo-card"><span className="grid h-11 w-11 place-items-center rounded-2xl bg-halo-soft text-halo-blue"><Icon name="truck" className="h-5 w-5" /></span><div className="min-w-0 flex-1"><p className="truncate text-sm font-extrabold text-halo-navy">{title}</p><p className="mt-1 text-[10px] text-halo-muted">Har'a · {status}</p></div><p className="text-xs font-black text-halo-navy">{amount}</p></article>)}</section>
            </div>;
          }
          '''
          text = text[:start] + customer + text[end:]

          old_call = 'if (tab === "wallet") return <WalletView role={role} />;'
          new_call = 'if (tab === "wallet") return role === "driver" ? <DriverWalletView userId={identity.userId} /> : <CustomerPaymentsView />;'
          if old_call not in text:
              raise SystemExit("Wallet call site not found")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)

          readme = Path("apps/mobile-app/README.md")
          body = readme.read_text()
          old = "Driver wallet records, Customer booking, Customer payments and Customer live tracking remain separate integration slices."
          new = "Driver Wallet now reads the signed-in Driver's financial summary, commission position and completed-trip payment results from existing self-scoped production sources. Customer booking, Customer payments and Customer live tracking remain separate integration slices."
          if old not in body:
              raise SystemExit("README remaining-slices sentence not found")
          body = body.replace(old, new, 1)
          body += (
              "\n\n## Driver Wallet boundary\n\n"
              "- Uses `driver_financial_summary(p_driver_id)` for released earnings, deposits and commission due.\n"
              "- Uses `my_driver_commission_summary()` for the Driver's current commission and job-lock position.\n"
              "- Reads recent immutable `driver_trip_payment_results` only for the signed-in assigned Driver.\n"
              "- Loads financial, commission and trip-history sources independently so one failure does not blank the others.\n"
              "- Preserves the last confirmed values during transient refresh failures and rejects stale refresh responses.\n"
              "- Refreshes on Driver-filtered realtime changes and coalesces overlapping refresh events.\n"
              "- Remains read-only; commission payment upload and payout requests are separate future slices.\n"
          )
          readme.write_text(body)
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile auth, operations and wallet
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-mobile-driver-wallet.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app .github/workflows/apply-mobile-driver-wallet.yml
          git commit -m "Integrate production mobile Driver wallet"
          git push origin HEAD:feat/mobile-driver-wallet

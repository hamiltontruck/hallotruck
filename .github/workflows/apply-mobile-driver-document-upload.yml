name: Apply mobile Driver document upload

on:
  push:
    branches:
      - feat/mobile-driver-document-upload
    paths:
      - .github/workflows/apply-mobile-driver-document-upload.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-document-upload
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Integrate Driver document upload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          profile_path = Path("apps/mobile-app/src/driver/DriverProfileView.tsx")
          text = profile_path.read_text()

          import_marker = 'import { useCallback, useEffect, useMemo, useRef, useState } from "react";\n'
          upload_import = 'import { DriverDocumentUploadSheet } from "./DriverDocumentUploadSheet";\n'
          if upload_import not in text:
              text = text.replace(import_marker, import_marker + upload_import, 1)

          document_row = r'''function DocumentRow({
            documentKey,
            record,
            onUpload,
            uploadDisabled = false,
          }: {
            documentKey: VerificationDocumentKey;
            record: DriverVerificationRecord | undefined;
            onUpload: () => void;
            uploadDisabled?: boolean;
          }) {
            const health = documentHealth(record);
            const copy = healthCopy[health];
            return <article className="border-t border-halo-line px-4 py-3 first:border-t-0">
              <div className="flex items-start gap-3"><span className={`mt-0.5 grid h-9 w-9 shrink-0 place-items-center rounded-xl text-sm font-black ${copy.className}`}>{health === "verified" ? "✓" : health === "rejected" || health === "expired" ? "!" : "•"}</span><div className="min-w-0 flex-1"><div className="flex flex-wrap items-start justify-between gap-2"><p className="text-sm font-extrabold leading-5 text-halo-navy">{documentLabels[documentKey]}</p><span className={`rounded-full px-2.5 py-1 text-[9px] font-black ${copy.className}`}>{copy.label}</span></div>{record?.expiryDate && <p className="mt-1 text-[10px] text-halo-muted">Expiry: {formatDate(record.expiryDate)}</p>}{record?.rejectionReason && <p className="mt-2 rounded-xl bg-red-50 px-3 py-2 text-[10px] font-bold leading-4 text-red-700">Sababa: {record.rejectionReason}</p>}{!record && <p className="mt-1 text-[10px] text-halo-muted">Document kana mobile profile irratti hin argamne.</p>}<button type="button" onClick={onUpload} disabled={uploadDisabled} className="mt-3 min-h-10 rounded-xl border border-halo-line bg-white px-3 text-[10px] font-black text-halo-blue shadow-sm disabled:cursor-not-allowed disabled:opacity-45">{record ? "Jijjiiri" : "Galchi"}</button></div></div>
            </article>;
          }

          function TruckCard'''
          text, count = re.subn(
              r'function DocumentRow\([\s\S]*?\nfunction TruckCard',
              document_row,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("DriverProfileView DocumentRow patch did not match exactly once")

          state_marker = '  const [selectedTruckId, setSelectedTruckId] = useState<string | null>(null);\n'
          state_insert = '''  const [uploadTarget, setUploadTarget] = useState<{ documentKey: VerificationDocumentKey; truckId: string | null; record: DriverVerificationRecord | undefined } | null>(null);
          const [uploadNotice, setUploadNotice] = useState<string | null>(null);
          '''
          if 'const [uploadTarget,' not in text:
              text = text.replace(state_marker, state_marker + state_insert, 1)

          error_marker = '    {profileError && <SourceError message={profileError} onRetry={() => void refresh()} />}\n'
          notice = '    {uploadNotice && <div role="status" className="rounded-2xl border border-emerald-100 bg-emerald-50 p-3 text-xs font-bold leading-5 text-emerald-700">{uploadNotice}</div>}\n'
          if notice not in text:
              text = text.replace(error_marker, notice + error_marker, 1)

          old_identity = '{identityDocumentKeys.map((key) => <DocumentRow key={key} documentKey={key} record={documents.find((record) => record.documentKey === key && record.truckId === null)} />)}'
          new_identity = '''{identityDocumentKeys.map((key) => {
            const record = documents.find((item) => item.documentKey === key && item.truckId === null);
            return <DocumentRow key={key} documentKey={key} record={record} onUpload={() => { setUploadNotice(null); setUploadTarget({ documentKey: key, truckId: null, record }); }} />;
          })}'''
          if old_identity not in text:
              raise SystemExit("Identity document map patch marker missing")
          text = text.replace(old_identity, new_identity, 1)

          old_vehicle = '{vehicleDocumentKeys.map((key) => <DocumentRow key={key} documentKey={key} record={selectedTruck ? documents.find((record) => record.documentKey === key && record.truckId === selectedTruck.id) : undefined} />)}'
          new_vehicle = '''{vehicleDocumentKeys.map((key) => {
            const record = selectedTruck ? documents.find((item) => item.documentKey === key && item.truckId === selectedTruck.id) : undefined;
            return <DocumentRow key={key} documentKey={key} record={record} uploadDisabled={!selectedTruck} onUpload={() => { if (!selectedTruck) return; setUploadNotice(null); setUploadTarget({ documentKey: key, truckId: selectedTruck.id, record }); }} />;
          })}'''
          if old_vehicle not in text:
              raise SystemExit("Vehicle document map patch marker missing")
          text = text.replace(old_vehicle, new_vehicle, 1)

          old_footer = '    <div className="rounded-2xl bg-halo-gold-soft p-4 text-xs leading-5 text-halo-gold-dark"><strong>Read-only profile:</strong> Mobile page kun status database keessaa qofa agarsiisa. Document upload/replacement fi Admin review hojii itti aanu keessatti adda hojjatama.</div>\n'
          new_footer = '''    <div className="rounded-2xl bg-halo-gold-soft p-4 text-xs leading-5 text-halo-gold-dark"><strong>Document upload/replacement:</strong> File haaraan Pending ta'ee Admin/CEO review eeggata. Verified document jijjiiruun verification duraanii hin dhaalu.</div>
              {uploadTarget && <DriverDocumentUploadSheet userId={userId} documentKey={uploadTarget.documentKey} documentLabel={documentLabels[uploadTarget.documentKey]} truckId={uploadTarget.truckId} currentRecord={uploadTarget.record} onClose={() => setUploadTarget(null)} onUploaded={async (message) => { setUploadNotice(message); setUploadTarget(null); await refresh(); }} />}
          '''
          if old_footer not in text:
              raise SystemExit("Profile footer patch marker missing")
          text = text.replace(old_footer, new_footer, 1)
          profile_path.write_text(text)

          profile_test_path = Path("apps/mobile-app/tests/driver-profile.test.mjs")
          profile_test = profile_test_path.read_text()
          profile_test = profile_test.replace(
              '  assert.match(componentSource, /Read-only profile/);',
              '  assert.match(componentSource, /DriverDocumentUploadSheet/);',
          )
          profile_test_path.write_text(profile_test)

          package_path = Path("apps/mobile-app/package.json")
          package = json.loads(package_path.read_text())
          script = package["scripts"]["test"]
          script = script.replace(
              "'.test-dist-commission'",
              "'.test-dist-commission','.test-dist-document-upload'",
          )
          script = script.replace(
              "tsc -p tsconfig.driver-commission-payment.json && node --test",
              "tsc -p tsconfig.driver-commission-payment.json && tsc -p tsconfig.driver-document-upload.json && node --test",
          )
          script = script.replace(
              "tests/driver-commission-payment.test.mjs",
              "tests/driver-commission-payment.test.mjs tests/driver-document-upload.test.mjs",
          )
          package["scripts"]["test"] = script
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          gitignore_path = Path("apps/mobile-app/.gitignore")
          gitignore = gitignore_path.read_text()
          if ".test-dist-document-upload/" not in gitignore:
              gitignore = gitignore.replace(".test-dist-commission/\n", ".test-dist-commission/\n.test-dist-document-upload/\n")
          gitignore_path.write_text(gitignore)

          readme_path = Path("apps/mobile-app/README.md")
          readme = readme_path.read_text()
          section = '''

          ## Driver document upload boundary

          - Allows the signed-in Driver to upload or replace only their own identity and assigned-truck verification evidence.
          - Accepts JPG, PNG, WebP or PDF up to 10 MB; Driver/truck photos remain image-only.
          - Stores private objects under `<driver-id>/identity/...` or `<driver-id>/truck-<truck-id>/...` with `upsert: false`.
          - Verifies both the current Supabase user and restored session before storage and database mutation.
          - Re-checks vehicle ownership before vehicle-document submission.
          - Resets every new or replacement submission to Pending for Admin/CEO review and clears stale rejection metadata.
          - Uploads the new object before updating the database, removes it after a confirmed database failure, and reconciles ambiguous mutation outcomes before cleanup.
          - Removes the superseded private object only after the database points to the new object.
          - Locks overlapping submissions and never queues verification mutations offline.
          - Does not approve documents, change Driver status, change truck assignment, alter RLS or expose a service-role key.
          '''
          if "## Driver document upload boundary" not in readme:
              readme += section
          readme_path.write_text(readme)
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile auth, operations, profile and upload
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-mobile-driver-document-upload.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app .github/workflows/apply-mobile-driver-document-upload.yml
          git commit -m "Add production mobile Driver document upload"
          git push origin HEAD:feat/mobile-driver-document-upload

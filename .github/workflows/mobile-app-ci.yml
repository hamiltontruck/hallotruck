name: Mobile App CI

on:
  pull_request:
    paths:
      - "apps/mobile-app/**"
      - ".github/workflows/mobile-app-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile-app/**"
      - ".github/workflows/mobile-app-ci.yml"

permissions:
  contents: read

jobs:
  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Test mobile authentication policy
        run: npm test

      - name: Build mobile app
        run: npm run build

      - name: Driver document preview browser smoke
        run: npm run test:document-preview-smoke

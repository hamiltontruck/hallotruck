name: Patch Partner fleet smoke executor

on:
  push:
    branches:
      - fix/partner-fleet-action-guidance
    paths:
      - .github/workflows/patch-partner-fleet-smoke-executor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-fleet-action-guidance
      - name: Use deterministic pending executor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/fleet-enterprise-e2e-smoke.mjs")
          source = path.read_text()
          old = 'React.createElement(PartnerFleetPanel,{partnerId:"partner-1",canManage:true,fixture:{...fixture,branches:fixture.branches.map((branch)=>({...branch,partner_id:"partner-1"}))})'
          new = 'React.createElement(PartnerFleetPanel,{partnerId:"partner-1",canManage:true,fixture:{...fixture,branches:fixture.branches.map((branch)=>({...branch,partner_id:"partner-1"}))},executeAction:()=>new Promise(()=>{})})'
          if old not in source:
              raise SystemExit("Partner fleet fixture props not found")
          source = source.replace(old, new, 1)
          old = 'globalThis.fetch=()=>new Promise(()=>{});\n'
          if old not in source:
              raise SystemExit("Temporary fetch override not found")
          source = source.replace(old, '', 1)
          path.write_text(source)
          Path(".github/workflows/patch-partner-fleet-smoke-executor.yml").unlink()
          PY
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fleet-enterprise-e2e-smoke.mjs .github/workflows/patch-partner-fleet-smoke-executor.yml
          git commit -m "Use deterministic Partner fleet smoke executor"
          git push origin HEAD:fix/partner-fleet-action-guidance

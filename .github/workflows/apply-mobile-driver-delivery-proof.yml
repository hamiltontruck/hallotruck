name: Apply mobile Driver delivery proof

on:
  push:
    branches:
      - feat/mobile-driver-delivery-proof
    paths:
      - ".github/workflows/apply-mobile-driver-delivery-proof.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-delivery-proof
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate Driver delivery proof
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          active = Path("apps/mobile-app/src/driver/DriverActiveTripView.tsx")
          text = active.read_text()

          queue_import = '} from "./driver-gps-queue";'
          proof_import = 'import { DriverDeliveryProofPanel } from "./DriverDeliveryProofPanel";'
          if proof_import not in text:
              if queue_import not in text:
                  raise SystemExit("GPS queue import anchor not found")
              text = text.replace(queue_import, queue_import + "\n" + proof_import, 1)

          state_anchor = '  const [speedKmh, setSpeedKmh] = useState<number | null>(null);'
          completed_state = '  const [completedTrackingId, setCompletedTrackingId] = useState<string | null>(null);'
          if completed_state not in text:
              if state_anchor not in text:
                  raise SystemExit("Active trip state anchor not found")
              text = text.replace(state_anchor, state_anchor + "\n" + completed_state, 1)

          new_trip_anchor = '      } else if (!previous || previous.id !== next.id) {\n        clearWatch();'
          new_trip_replacement = '      } else if (!previous || previous.id !== next.id) {\n        setCompletedTrackingId(null);\n        clearWatch();'
          if new_trip_replacement not in text:
              if new_trip_anchor not in text:
                  raise SystemExit("New trip reset anchor not found")
              text = text.replace(new_trip_anchor, new_trip_replacement, 1)

          effect_marker = '  useEffect(() => {\n    mountedRef.current = true;'
          callback = (
              '  const handleDelivered = useCallback((trackingId: string) => {\n'
              '    const completed = tripRef.current;\n'
              '    clearWatch();\n'
              '    if (completed) clearQueuedDriverPings(userId, completed.id);\n'
              '    setGpsState("idle");\n'
              '    setPendingCount(0);\n'
              '    setDriverPosition(null);\n'
              '    setLastPingAt(null);\n'
              '    setSpeedKmh(null);\n'
              '    setRoute(null);\n'
              '    setRouteOrderId(null);\n'
              '    setCompletedTrackingId(trackingId);\n'
              '    setTrip(null);\n'
              '    tripRef.current = null;\n'
              '    void refreshTrip(true);\n'
              '  }, [clearWatch, refreshTrip, userId]);\n\n'
          )
          if callback not in text:
              if effect_marker not in text:
                  raise SystemExit("Mounted effect marker not found")
              text = text.replace(effect_marker, callback + effect_marker, 1)

          empty_start = text.index('  if (!trip) {')
          empty_end = text.index('  const gps =', empty_start)
          empty_block = (
              '  if (!trip) {\n'
              '    if (completedTrackingId) {\n'
              '      return <div className="grid min-h-[calc(100dvh-137px)] place-items-center bg-halo-canvas px-5">\n'
              '        <section className="w-full max-w-sm rounded-[28px] border border-emerald-200 bg-white p-7 text-center shadow-halo-card" data-mobile-trip-complete>\n'
              '          <span className="mx-auto grid h-16 w-16 place-items-center rounded-full bg-emerald-100 text-3xl text-emerald-700">✓</span>\n'
              '          <p className="mt-5 text-[10px] font-black uppercase tracking-[0.18em] text-emerald-700">{completedTrackingId}</p>\n'
              '          <h1 className="mt-2 text-2xl font-black text-halo-navy">Trip milkaa\'inaan xumurameera</h1>\n'
              '          <p className="mt-3 text-sm leading-6 text-halo-muted">Delivery proof fi payment result server irratti olkaa\'amaniiru. Trip kun active workspace keessaa haqameera.</p>\n'
              '          {error && <p role="alert" className="mt-4 rounded-2xl bg-amber-50 px-4 py-3 text-xs font-bold text-amber-800">{error}</p>}\n'
              '          <button type="button" onClick={() => { setCompletedTrackingId(null); void refreshTrip(); }} className="mt-6 min-h-12 w-full rounded-2xl bg-halo-blue px-5 font-black text-white">Hojii itti aanu ilaali</button>\n'
              '        </section>\n'
              '      </div>;\n'
              '    }\n'
              '    return <div className="grid min-h-[calc(100dvh-137px)] place-items-center bg-halo-canvas px-5"><section className="w-full max-w-sm rounded-[28px] border border-halo-line bg-white p-7 text-center shadow-halo-card"><p className="text-[10px] font-black uppercase tracking-[0.18em] text-halo-gold-dark">Active trip</p><h1 className="mt-3 text-2xl font-black text-halo-navy">Trip hojii irra jiru hin jiru</h1><p className="mt-3 text-sm leading-6 text-halo-muted">Hojii fudhatte erga jiraate booda route fi GPS controls as irratti mul\'atu.</p>{error && <p role="alert" className="mt-4 rounded-2xl bg-red-50 px-4 py-3 text-sm font-bold text-red-700">{error}</p>}<button type="button" onClick={() => void refreshTrip()} className="mt-6 min-h-12 w-full rounded-2xl bg-halo-blue px-5 font-black text-white">Irra deebi\'ii ilaali</button></section></div>;\n'
              '  }\n\n'
          )
          text = text[:empty_start] + empty_block + text[empty_end:]

          driver_card = '      <div className="mt-4 flex items-center gap-3 rounded-2xl bg-halo-soft p-3">'
          proof_panel = (
              '      {trip.status === "in_transit" && (\n'
              '        <DriverDeliveryProofPanel trip={trip} userId={userId} onDelivered={handleDelivered} />\n'
              '      )}\n\n'
          )
          if proof_panel not in text:
              if driver_card not in text:
                  raise SystemExit("Driver card anchor not found")
              text = text.replace(driver_card, proof_panel + driver_card, 1)

          active.write_text(text)

          active_test = Path("apps/mobile-app/tests/driver-active-trip.test.mjs")
          test_text = active_test.read_text()
          fixture_anchor = '    accepted_at: null,\n'
          fixture_replacement = '    accepted_at: null,\n    selected_payment_method: "cash",\n'
          if fixture_replacement not in test_text:
              if fixture_anchor not in test_text:
                  raise SystemExit("Active trip test fixture anchor not found")
              test_text = test_text.replace(fixture_anchor, fixture_replacement, 1)
          assertion_anchor = '  assert.equal(accepted?.priceEtb, 12000);\n'
          assertion_replacement = assertion_anchor + '  assert.equal(accepted?.selectedPaymentMethod, "cash");\n'
          if 'accepted?.selectedPaymentMethod' not in test_text:
              test_text = test_text.replace(assertion_anchor, assertion_replacement, 1)
          active_test.write_text(test_text)

          package_path = Path("apps/mobile-app/package.json")
          package = json.loads(package_path.read_text())
          package["scripts"]["test"] = (
              "node -e \"for (const path of ['.test-dist','.test-dist-active','.test-dist-delivery']) "
              "require('fs').rmSync(path,{recursive:true,force:true})\" && "
              "tsc -p tsconfig.policy.json && tsc -p tsconfig.driver-jobs.json && "
              "tsc -p tsconfig.active-trip.json && tsc -p tsconfig.delivery-proof.json && "
              "node --test tests/access-policy.test.mjs tests/driver-jobs.test.mjs "
              "tests/driver-active-trip.test.mjs tests/driver-delivery-proof.test.mjs"
          )
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          gitignore = Path("apps/mobile-app/.gitignore")
          ignored = gitignore.read_text()
          if ".test-dist-delivery/" not in ignored:
              ignored = ignored.replace(".test-dist-active/\n", ".test-dist-active/\n.test-dist-delivery/\n")
          gitignore.write_text(ignored)

          readme = Path("apps/mobile-app/README.md")
          body = readme.read_text()
          old_status = "Driver Active Trip now reads the assigned order, route geometry and navigation instructions from production services. GPS updates use the authenticated tracking function, remain offline-safe, and show `in_transit` only after the server-confirmed order state is re-read. Driver wallet records, Customer booking, Customer payments and Customer live tracking remain separate integration slices."
          new_status = "Driver Active Trip reads the assigned order, route geometry and navigation instructions from production services. GPS remains offline-safe and shows `in_transit` only after server confirmation. An In Transit Driver can now capture the delivery photo, receiver name and signature, report the customer-selected payment outcome, and complete the order through the existing atomic `driver_finish_trip` RPC. Driver wallet records, Customer booking, Customer payments and Customer live tracking remain separate integration slices."
          if old_status not in body:
              raise SystemExit("README active-trip status paragraph not found")
          body = body.replace(old_status, new_status, 1)
          if "## Driver Delivery Proof boundary" not in body:
              body += (
                  "\n\n## Driver Delivery Proof boundary\n\n"
                  "- Appears only for the signed-in Driver's `in_transit` order.\n"
                  "- Uses mobile rear-camera capture or gallery selection; images must be under 8 MB.\n"
                  "- Requires receiver name, delivery photo and pointer/touch signature.\n"
                  "- Restricts payment outcomes to the customer's database-selected Cash or Bank / Telebirr method, plus Payment not received.\n"
                  "- Requires the exact invoice amount for cash collected by the Driver.\n"
                  "- Does not queue delivery or financial mutations offline.\n"
                  "- Uploads proof files only to the private `delivery-proofs` bucket under the order ID.\n"
                  "- Calls the existing authenticated `driver_finish_trip` RPC so proof, Delivered status and payment result remain one server transaction.\n"
                  "- Reconciles ambiguous retry outcomes against `delivery_proofs` before deleting uploaded files.\n"
                  "- Stops live GPS and clears order-scoped queued pings after successful completion.\n"
              )
          readme.write_text(body)
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile auth, jobs, trip and delivery proof
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-mobile-driver-delivery-proof.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app .github/workflows/apply-mobile-driver-delivery-proof.yml
          git commit -m "Integrate mobile Driver delivery proof"
          git push origin HEAD:feat/mobile-driver-delivery-proof

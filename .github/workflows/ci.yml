name: CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-anon-key

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm run test:regression

      - name: Legacy TypeScript and production build
        run: npm run build
        env:
          VITE_PARTNER_SMART_ORDER_V2: "false"

      - name: Partner Smart Order V2 production build
        run: npm run build
        env:
          VITE_PARTNER_SMART_ORDER_V2: "true"

      - name: Partner Smart Order V2 smoke
        run: node scripts/partner-order-e2e-smoke.mjs
        env:
          VITE_PARTNER_SMART_ORDER_V2: "true"

      - name: Restore legacy build for full browser smoke
        run: npm run build
        env:
          VITE_PARTNER_SMART_ORDER_V2: "false"

      - name: Browser smoke tests
        run: npm run test:e2e-smoke
        env:
          VITE_PARTNER_SMART_ORDER_V2: "false"

name: CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-anon-key

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm run test:regression

      - name: TypeScript and production build
        run: npm run build

      - name: Browser smoke tests
        run: npm run test:e2e-smoke

name: Apply Admin Operations hardening

on:
  push:
    branches:
      - feat/admin-operations-filter-accessibility
    paths:
      - scripts/apply-admin-operations-hardening.mjs
      - .github/workflows/apply-admin-operations-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-operations-filter-accessibility
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare source-only patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-admin-operations-hardening.mjs")
          source = path.read_text()
          marker = '\nconst regressionPath = "tests/regression/admin-operations-ux.test.ts";'
          if marker not in source:
              raise SystemExit("Temporary patch split marker was not found")
          source = source.split(marker, 1)[0]
          source += '\nconsole.log("Applied Admin Operations KPI, URL filter, responsive and accessibility hardening.");\n'
          path.write_text(source)
          PY
          node --check scripts/apply-admin-operations-hardening.mjs

      - name: Apply focused source patch
        run: node scripts/apply-admin-operations-hardening.mjs

      - name: Align Driver filters with the domain type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/pages/SmartLogistics.tsx")
          source = path.read_text()
          source = source.replace(
              "driver.full_name,driver.phone,driver.email,driver.driver_status",
              "driver.full_name,driver.phone,driver.driver_status",
          )
          source = source.replace(
              'subtitle={d.phone||d.email||"No contact details"}',
              'subtitle={d.phone||"No phone recorded"}',
          )
          path.write_text(source)
          PY

      - name: Install
        run: npm ci

      - name: Validate full production suite
        run: |
          npm run lint
          npm run test:regression
          npm run build
          npm run test:e2e-smoke
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_FUNCTIONS_URL: ${{ secrets.VITE_SUPABASE_FUNCTIONS_URL }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-admin-operations-hardening.mjs
          rm .github/workflows/apply-admin-operations-hardening.yml

      - name: Commit hardened Admin Operations
        run: |
          git config user.name "hamiltontruck"
          git config user.email "hamiltoninternational8@gmail.com"
          git add -A
          git commit -m "Harden Admin Operations filters and accessibility"
          git push origin HEAD:feat/admin-operations-filter-accessibility

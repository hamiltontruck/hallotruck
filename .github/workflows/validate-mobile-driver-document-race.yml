name: Validate mobile Driver document race guard

on:
  push:
    branches:
      - feat/mobile-driver-document-upload
    paths:
      - .github/workflows/validate-mobile-driver-document-race.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-document-upload
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile app
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/validate-mobile-driver-document-race.yml

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-mobile-driver-document-race.yml
          git commit -m "Validate mobile Driver document race guard"
          git push origin HEAD:feat/mobile-driver-document-upload

name: Apply mobile Driver active trip

on:
  push:
    branches:
      - feat/mobile-driver-active-trip
    paths:
      - ".github/workflows/apply-mobile-driver-active-trip.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-active-trip
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate real Driver active trip
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile-app/src/App.tsx")
          text = path.read_text()

          jobs_import = 'import { DriverJobsBoard } from "./driver/DriverJobsBoard";'
          trip_import = 'import { DriverActiveTripView } from "./driver/DriverActiveTripView";'
          if trip_import not in text:
              if jobs_import not in text:
                  raise SystemExit("DriverJobsBoard import not found")
              text = text.replace(jobs_import, jobs_import + "\n" + trip_import, 1)

          old_header = 'function LiveMapView({ role }: { role: Role }) {'
          if old_header not in text:
              raise SystemExit("LiveMapView header not found")
          text = text.replace(old_header, 'function CustomerLiveMapView() {', 1)

          replacements = {
              '{role === "driver" ? "Active trip" : "Live order"}': 'Live order',
              '<Icon name={role === "driver" ? "truck" : "user"} />': '<Icon name="user" />',
              '{role === "driver" ? "Fuso · ABC-12345" : "Abdi D. · Driver"}': 'Abdi D. · Driver',
              '{role === "driver" ? "GPS active · Signal gaarii" : "★ 4.8 · Fuso 10 Ton"}': '★ 4.8 · Fuso 10 Ton',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected customer map expression not found: {old}")
              text = text.replace(old, new, 1)

          marker = 'function WalletView({ role }: { role: Role }) {'
          wrapper = '''function LiveMapView({ role, identity }: { role: Role; identity: MobileIdentity }) {
            if (role === "driver") return <DriverActiveTripView userId={identity.userId} fullName={identity.fullName} />;
            return <CustomerLiveMapView />;
          }

          '''
          if wrapper not in text:
              if marker not in text:
                  raise SystemExit("WalletView marker not found")
              text = text.replace(marker, wrapper + marker, 1)

          old_call = 'if (tab === "map") return <LiveMapView role={role} />;'
          new_call = 'if (tab === "map") return <LiveMapView role={role} identity={identity} />;'
          if old_call not in text:
              raise SystemExit("LiveMapView call site not found")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)

          readme = Path("apps/mobile-app/README.md")
          body = readme.read_text()
          old_status = "Driver live-map controls, driver wallet records, Customer booking, Customer payments and live GPS remain separate integration slices. Those screens continue to use display data until their focused production integrations are completed."
          new_status = "Driver Active Trip now reads the assigned order, route geometry and navigation instructions from production services. GPS updates use the authenticated tracking function, remain offline-safe, and show `in_transit` only after the server-confirmed order state is re-read. Driver wallet records, Customer booking, Customer payments and Customer live tracking remain separate integration slices."
          if old_status not in body:
              raise SystemExit("README implementation status paragraph not found")
          body = body.replace(old_status, new_status, 1)
          body += (
              "\n\n## Driver Active Trip boundary\n\n"
              "- Reads only the signed-in Driver's `accepted` or `in_transit` order under existing Orders RLS.\n"
              "- Loads route geometry and instructions through the authenticated `navigation` Edge Function.\n"
              "- Sends high-accuracy browser GPS through the authenticated `tracking` Edge Function.\n"
              "- Keeps the database order `accepted` while a GPS ping is only queued offline.\n"
              "- Re-reads the assigned order after every successful ping before showing `in_transit` or live status.\n"
              "- Stores at most 20 queued pings per Driver/order under the isolated `hallo-mobile-driver-gps-v1` key.\n"
              "- Syncs queued pings when connectivity returns and preserves authorization/lifecycle failures for the Driver.\n"
              "- Stops and clears stale GPS work when the order is no longer assigned or active.\n"
              "- Uses real route geometry in a lightweight SVG route viewport; a full tile basemap remains a later renderer slice.\n"
          )
          readme.write_text(body)
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile auth, jobs and active trip
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-mobile-driver-active-trip.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app .github/workflows/apply-mobile-driver-active-trip.yml
          git commit -m "Integrate real mobile Driver active trip"
          git push origin HEAD:feat/mobile-driver-active-trip

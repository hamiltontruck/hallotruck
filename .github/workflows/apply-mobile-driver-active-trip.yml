name: Apply mobile Driver active trip

on:
  push:
    branches:
      - feat/mobile-driver-active-trip
    paths:
      - ".github/workflows/apply-mobile-driver-active-trip.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-active-trip
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate real Driver active trip
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile-app/src/App.tsx")
          text = path.read_text()

          jobs_import = 'import { DriverJobsBoard } from "./driver/DriverJobsBoard";'
          trip_import = 'import { DriverActiveTripView } from "./driver/DriverActiveTripView";'
          if trip_import not in text:
              if jobs_import not in text:
                  raise SystemExit("DriverJobsBoard import not found")
              text = text.replace(jobs_import, jobs_import + "\n" + trip_import, 1)

          old_header = 'function LiveMapView({ role }: { role: Role }) {'
          if old_header not in text:
              raise SystemExit("LiveMapView header not found")
          text = text.replace(old_header, 'function CustomerLiveMapView() {', 1)

          replacements = {
              '{role === "driver" ? "Active trip" : "Live order"}': 'Live order',
              '<Icon name={role === "driver" ? "truck" : "user"} />': '<Icon name="user" />',
              '{role === "driver" ? "Fuso · ABC-12345" : "Abdi D. · Driver"}': 'Abdi D. · Driver',
              '{role === "driver" ? "GPS active · Signal gaarii" : "★ 4.8 · Fuso 10 Ton"}': '★ 4.8 · Fuso 10 Ton',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected customer map expression not found: {old}")
              text = text.replace(old, new, 1)

          marker = 'function WalletView({ role }: { role: Role }) {'
          wrapper = '''function LiveMapView({ role, identity }: { role: Role; identity: MobileIdentity }) {
            if (role === "driver") return <DriverActiveTripView userId={identity.userId} fullName={identity.fullName} />;
            return <CustomerLiveMapView />;
          }

          '''
          if wrapper not in text:
              if marker not in text:
                  raise SystemExit("WalletView marker not found")
              text = text.replace(marker, wrapper + marker, 1)

          old_call = 'if (tab === "map") return <LiveMapView role={role} />;'
          new_call = 'if (tab === "map") return <LiveMapView role={role} identity={identity} />;'
          if old_call not in text:
              raise SystemExit("LiveMapView call site not found")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)

          readme = Path("apps/mobile-app/README.md")
          body = readme.read_text()
          old_status = "The responsive UI shell now includes a secure Supabase authentication boundary. Email/password sessions are restored in isolated mobile storage, and the workspace is selected only from `profiles.role` plus `driver_status` in the database. Operational screens still use display data; orders, payments, wallet records and live GPS remain separate integration slices."
          new_status = "The responsive UI shell now includes secure Supabase authentication, database-backed Driver Jobs, and a server-authorized Driver Active Trip workspace. Driver route geometry comes from the existing navigation function; GPS updates use the tracking function, remain offline-safe, and change the trip to `in_transit` only after a server-confirmed update. Customer booking/tracking, payment, wallet, delivery proof and profile data remain separate integration slices."
          if old_status not in body:
              raise SystemExit("README implementation status paragraph not found")
          body = body.replace(old_status, new_status, 1)
          body += """

## Driver Active Trip boundary

- Reads only the signed-in Driver's `accepted` or `in_transit` order under existing Orders RLS.
- Loads route geometry and instructions through the authenticated `navigation` Edge Function.
- Sends high-accuracy browser GPS through the authenticated `tracking` Edge Function.
- Keeps the database order `accepted` while a GPS ping is only queued offline.
- Re-reads the assigned order after every successful ping before showing `in_transit` or live status.
- Stores at most 20 queued pings per Driver/order under the isolated `hallo-mobile-driver-gps-v1` key.
- Syncs queued pings when connectivity returns and preserves authorization/lifecycle failures for the Driver.
- Stops and clears stale GPS work when the order is no longer assigned or active.
- Uses real route geometry in a lightweight SVG route viewport; a full tile basemap remains a later renderer slice.
"""
          readme.write_text(body)
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile auth, jobs and active trip
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-mobile-driver-active-trip.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app .github/workflows/apply-mobile-driver-active-trip.yml
          git commit -m "Integrate real mobile Driver active trip"
          git push origin HEAD:feat/mobile-driver-active-trip

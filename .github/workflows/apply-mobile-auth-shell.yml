name: Apply mobile auth shell

on:
  push:
    branches:
      - feat/mobile-auth-role-isolation
    paths:
      - scripts/apply-mobile-auth-shell.py
      - .github/workflows/apply-mobile-auth-shell.yml

permissions:
  contents: write

concurrency:
  group: apply-mobile-auth-shell
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-auth-role-isolation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply authenticated shell patch
        run: python scripts/apply-mobile-auth-shell.py

      - name: Create reproducible mobile lockfile
        working-directory: apps/mobile-app
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile authentication policy
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time patch files
        run: rm scripts/apply-mobile-auth-shell.py .github/workflows/apply-mobile-auth-shell.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate mobile authentication and role isolation"
          git push origin HEAD:feat/mobile-auth-role-isolation

name: Patch Partner Settlement Guidance

on:
  push:
    branches:
      - fix/partner-settlement-action-guidance

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[partner-guidance-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/partner-settlement-action-guidance
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused guidance patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          component_path = Path("src/components/partner/AdminPartnerSettlementWorkflow.tsx")
          component = component_path.read_text()
          component = replace_once(
              component,
              '  const [open, setOpen] = useState<OpenPanel>(null);\n',
              '  const [open, setOpen] = useState<OpenPanel>(null);\n  const settlementBusyGuidanceId = "partner-settlement-workflow-busy-guidance";\n  const settlementBusyReason = "Another settlement operation is in progress. Wait for it to finish before starting a new settlement action.";\n',
              "busy guidance constants",
          )
          component = replace_once(
              component,
              '  return <section className="space-y-5">\n',
              '  return <section aria-busy={busy} className="space-y-5">\n',
              "workflow aria-busy",
          )
          component = replace_once(
              component,
              '      <p className="mt-2 text-xs leading-5 text-steel">A request must pass review and approval before any partial or full payment is recorded.</p>\n',
              '      <p className="mt-2 text-xs leading-5 text-steel">A request must pass review and approval before any partial or full payment is recorded.</p>\n      {busy && <p id={settlementBusyGuidanceId} role="status" aria-live="polite" className="mt-3 border border-amber/30 bg-amber/10 px-3 py-2 text-xs leading-5 text-asphalt">{settlementBusyReason}</p>}\n',
              "visible busy guidance",
          )
          disabled_count = component.count('disabled={busy}')
          if disabled_count != 9:
              raise SystemExit(f"disabled action count: expected 9, found {disabled_count}")
          component = component.replace(
              'disabled={busy}',
              'disabled={busy} aria-describedby={busy ? settlementBusyGuidanceId : undefined} title={busy ? settlementBusyReason : undefined}',
          )
          component_path.write_text(component)

          regression_path = Path("tests/regression/dead-route-controls.test.ts")
          regression = regression_path.read_text()
          regression += '''\n\ntest("Partner settlement busy actions explain the temporary workflow lock", () => {\n  const source = readFileSync(path.join(process.cwd(), "src/components/partner/AdminPartnerSettlementWorkflow.tsx"), "utf8");\n  const smoke = readFileSync(path.join(process.cwd(), "scripts/partner-settlement-e2e-smoke.mjs"), "utf8");\n\n  assert.match(source, /partner-settlement-workflow-busy-guidance/);\n  assert.match(source, /Another settlement operation is in progress\. Wait for it to finish before starting a new settlement action\./);\n  assert.match(source, /role="status" aria-live="polite"/);\n  assert.match(source, /aria-describedby=\{busy \? settlementBusyGuidanceId : undefined\}/);\n  assert.match(source, /title=\{busy \? settlementBusyReason : undefined\}/);\n  assert.match(source, /aria-busy=\{busy\}/);\n  assert.match(smoke, /data-busy-guidance/);\n  assert.match(smoke, /data-described-disabled/);\n});\n'''
          regression_path.write_text(regression)

          smoke_path = Path("scripts/partner-settlement-e2e-smoke.mjs")
          smoke = smoke_path.read_text()
          smoke = replace_once(
              smoke,
              'function render(chrome, width, profile) {\n  const args = ["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage", "--hide-scrollbars", `--window-size=${width},1100`, "--virtual-time-budget=3000", `--user-data-dir=${profile}`, "--dump-dom", `${baseUrl}partner-settlement-e2e.html`];\n',
              'function render(chrome, width, profile, query = "") {\n  const target = `${baseUrl}partner-settlement-e2e.html${query}`;\n  const args = ["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage", "--hide-scrollbars", `--window-size=${width},1100`, "--virtual-time-budget=3000", `--user-data-dir=${profile}`, "--dump-dom", target];\n',
              "browser target query",
          )
          smoke = replace_once(
              smoke,
              'const now = ${JSON.stringify(now)};\n',
              'const now = ${JSON.stringify(now)};\nconst isBusy = new URLSearchParams(window.location.search).get("busy") === "1";\n',
              "busy fixture state",
          )
          smoke = replace_once(
              smoke,
              "busy:false, runAction:async()=>true",
              "busy:isBusy, runAction:async()=>true",
              "fixture busy prop",
          )
          smoke = replace_once(
              smoke,
              "document.documentElement.dataset.overflow = String(document.documentElement.scrollWidth > document.documentElement.clientWidth || document.body.scrollWidth > document.body.clientWidth);\ndocument.documentElement.dataset.ready = 'true';\n",
              "document.documentElement.dataset.overflow = String(document.documentElement.scrollWidth > document.documentElement.clientWidth || document.body.scrollWidth > document.body.clientWidth);\ndocument.documentElement.dataset.busyGuidance = String(Boolean(document.getElementById('partner-settlement-workflow-busy-guidance')));\ndocument.documentElement.dataset.describedDisabled = String([...document.querySelectorAll('button:disabled')].every((button) => button.getAttribute('aria-describedby') === 'partner-settlement-workflow-busy-guidance'));\ndocument.documentElement.dataset.ready = 'true';\n",
              "busy fixture diagnostics",
          )
          smoke = replace_once(
              smoke,
              "      for (const expected of ['data-ready=\"true\"', 'data-overflow=\"false\"', \"Create pending settlement\", \"Start review\", \"Approve\", \"Reject\", \"Record payment\", \"Reverse settlement\", \"partially paid\", \"Outstanding 150,000 ETB\"]) {\n        if (!dom.includes(expected)) throw new Error(`Partner settlement ${width}px smoke missing: ${expected}`);\n      }\n",
              "      for (const expected of ['data-ready=\"true\"', 'data-overflow=\"false\"', 'data-busy-guidance=\"false\"', \"Create pending settlement\", \"Start review\", \"Approve\", \"Reject\", \"Record payment\", \"Reverse settlement\", \"partially paid\", \"Outstanding 150,000 ETB\"]) {\n        if (!dom.includes(expected)) throw new Error(`Partner settlement ${width}px smoke missing: ${expected}`);\n      }\n      const busyDom = render(chrome, width, profile, \"?busy=1\");\n      for (const expected of ['data-ready=\"true\"', 'data-overflow=\"false\"', 'data-busy-guidance=\"true\"', 'data-described-disabled=\"true\"', \"Another settlement operation is in progress. Wait for it to finish before starting a new settlement action.\"]) {\n        if (!busyDom.includes(expected)) throw new Error(`Busy Partner settlement ${width}px smoke missing: ${expected}`);\n      }\n",
              "busy browser assertions",
          )
          smoke = smoke.replace(
              "Partner settlement browser smoke passed at 320px, 360px, 390px and 412px with no horizontal overflow.",
              "Partner settlement browser smoke passed at 320px, 360px, 390px and 412px with explained busy locks and no horizontal overflow.",
          )
          smoke_path.write_text(smoke)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate lint
        run: npm run lint

      - name: Validate regression
        run: npm run test:regression

      - name: Validate production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_SUPABASE_FUNCTIONS_URL: https://example.supabase.co/functions/v1
          VITE_MAPTILER_KEY: ci-map-key

      - name: Validate Partner settlement browser fixture
        run: node scripts/partner-settlement-e2e-smoke.mjs

      - name: Validate full browser suite
        run: npm run test:e2e-smoke

      - name: Remove temporary workflow
        run: rm .github/workflows/patch-partner-settlement-guidance.yml

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "hamiltontruck"
          git config user.email "hamiltoninternational8@gmail.com"
          git add src/components/partner/AdminPartnerSettlementWorkflow.tsx tests/regression/dead-route-controls.test.ts scripts/partner-settlement-e2e-smoke.mjs .github/workflows/patch-partner-settlement-guidance.yml
          git commit -m "Explain Partner settlement workflow locks [partner-guidance-complete]"
          git push origin HEAD:fix/partner-settlement-action-guidance

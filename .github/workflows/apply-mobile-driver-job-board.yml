name: Apply mobile driver job board

on:
  push:
    branches:
      - feat/mobile-driver-job-board
    paths:
      - ".github/workflows/apply-mobile-driver-job-board.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-job-board
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate database-backed driver job board
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile-app/src/App.tsx")
          text = path.read_text()

          auth_import = 'import { MobileAuthBoundary, type MobileIdentity } from "./auth/MobileAuthBoundary";'
          jobs_import = 'import { DriverJobsBoard } from "./driver/DriverJobsBoard";'
          if jobs_import not in text:
              text = text.replace(auth_import, auth_import + "\n" + jobs_import, 1)

          start = text.index("const jobs = [")
          end = text.index("function Field(", start)
          replacement = '''function JobsView({ role, identity }: { role: Role; identity: MobileIdentity }) {
            if (role === "customer") return <ShipmentForm />;
            return <DriverJobsBoard userId={identity.userId} fullName={identity.fullName} />;
          }

          '''
          text = text[:start] + replacement + text[end:]

          old_call = 'if (tab === "jobs") return <JobsView role={role} />;'
          new_call = 'if (tab === "jobs") return <JobsView role={role} identity={identity} />;'
          if old_call not in text:
              raise SystemExit("JobsView call site was not found")
          text = text.replace(old_call, new_call, 1)

          old_deps = '}, [role, tab]);'
          new_deps = '}, [identity, role, tab]);'
          if old_deps not in text:
              raise SystemExit("Mobile workspace memo dependency list was not found")
          text = text.replace(old_deps, new_deps, 1)

          path.write_text(text)
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile auth and driver jobs
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-mobile-driver-job-board.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app .github/workflows/apply-mobile-driver-job-board.yml
          git commit -m "Integrate secure mobile driver job board"
          git push origin HEAD:feat/mobile-driver-job-board

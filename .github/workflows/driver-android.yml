name: Driver Android

on:
  pull_request:
    paths: ["mobile/driver/android/**", ".github/workflows/driver-android.yml"]
  push:
    branches: [main]
    paths: ["mobile/driver/android/**", ".github/workflows/driver-android.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/driver/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        shell: bash
        run: set -o pipefail; gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee driver-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-android-test-log
          path: mobile/driver/android/driver-test.log
          if-no-files-found: ignore
      - name: Android lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

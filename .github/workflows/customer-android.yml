name: Customer Android

on:
  pull_request:
    paths:
      - "mobile/customer/android/**"
      - ".github/workflows/customer-android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/customer/android/**"
      - ".github/workflows/customer-android.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/customer/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Android lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

name: Patch Partner fleet action guidance

on:
  push:
    branches:
      - fix/partner-fleet-action-guidance
    paths:
      - .github/workflows/patch-partner-fleet-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-fleet-action-guidance
      - name: Apply focused Partner fleet guidance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/partner/PartnerFleetPanel.tsx")
          source = path.read_text()

          def replace(old: str, new: str, count: int = 1):
              global source
              if source.count(old) < count:
                  raise SystemExit(f"Expected source fragment not found: {old[:120]!r}")
              source = source.replace(old, new, count)

          replace(
              '  const [saving, setSaving] = useState(false);\n',
              '  const [activeAction, setActiveAction] = useState<null | { key: string; message: string }>(null);\n'
              '  const saving = activeAction !== null;\n'
              '  const busyMessage = activeAction?.message ?? "";\n',
          )

          replace(
              '  async function run(action: () => Promise<unknown>, success: string) {\n'
              '    setSaving(true); setError(""); setNotice("");\n'
              '    try { await action(); setNotice(success); await load(); }\n'
              '    catch (actionError) { setError(actionError instanceof Error ? actionError.message : "Fleet action could not be completed."); }\n'
              '    finally { setSaving(false); }\n'
              '  }\n',
              '  async function run(actionKey: string, message: string, action: () => Promise<unknown>, success: string) {\n'
              '    if (activeAction) return;\n'
              '    setActiveAction({ key: actionKey, message }); setError(""); setNotice("");\n'
              '    try { await action(); setNotice(success); await load(); }\n'
              '    catch (actionError) { setError(actionError instanceof Error ? actionError.message : "Fleet action could not be completed."); }\n'
              '    finally { setActiveAction(null); }\n'
              '  }\n',
          )

          replace(
              'void run(() => createFleetVehicle(',
              'void run("register_vehicle", "Registering a Partner vehicle. Other fleet actions are temporarily locked until this update finishes.", () => createFleetVehicle(',
          )
          replace(
              'void run(() => createFleetBranch(',
              'void run("create_branch", "Creating a Partner fleet branch. Other fleet actions are temporarily locked until this update finishes.", () => createFleetBranch(',
          )

          replace(
              '  return <section className="space-y-5" data-testid="partner-fleet-panel">\n',
              '  return <section className="space-y-5" data-testid="partner-fleet-panel" aria-busy={saving} aria-describedby={saving ? "partner-fleet-action-guidance" : undefined}>\n'
              '    {saving && <p id="partner-fleet-action-guidance" role="status" aria-live="polite" className="break-words border border-sky-700/25 bg-sky-50 p-4 text-sm font-semibold text-sky-900">{busyMessage}</p>}\n',
          )

          replace(
              '<form onSubmit={submitVehicle} className="mt-4 grid gap-3 sm:grid-cols-2">',
              '<form onSubmit={submitVehicle} aria-busy={activeAction?.key === "register_vehicle"} className="mt-4 grid gap-3 sm:grid-cols-2">',
          )
          replace(
              '<button disabled={saving} className="min-h-12 bg-asphalt px-4 text-sm font-semibold text-white disabled:opacity-40 sm:col-span-2">{saving ? "Saving…" : "Register vehicle"}</button>',
              '<button disabled={saving} aria-describedby={saving ? "partner-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Register Partner vehicle"} className="min-h-12 bg-asphalt px-4 text-sm font-semibold text-white disabled:opacity-40 sm:col-span-2">{activeAction?.key === "register_vehicle" ? "Registering vehicle…" : "Register vehicle"}</button>',
          )
          replace(
              '<form onSubmit={submitBranch} className="mt-4 grid gap-3 sm:grid-cols-2">',
              '<form onSubmit={submitBranch} aria-busy={activeAction?.key === "create_branch"} className="mt-4 grid gap-3 sm:grid-cols-2">',
          )
          replace(
              '<button disabled={saving} className="min-h-12 bg-asphalt px-4 text-sm font-semibold text-white disabled:opacity-40 sm:col-span-2">{saving ? "Saving…" : "Create branch"}</button>',
              '<button disabled={saving} aria-describedby={saving ? "partner-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Create Partner fleet branch"} className="min-h-12 bg-asphalt px-4 text-sm font-semibold text-white disabled:opacity-40 sm:col-span-2">{activeAction?.key === "create_branch" ? "Creating branch…" : "Create branch"}</button>',
          )

          replace(
              '<PartnerVehicle key={vehicle.vehicle_id} vehicle={vehicle} data={data} canManage={canManage} saving={saving} run={run} />',
              '<PartnerVehicle key={vehicle.vehicle_id} vehicle={vehicle} data={data} canManage={canManage} activeAction={activeAction} busyMessage={busyMessage} run={run} />',
          )
          replace(
              'function PartnerVehicle({ vehicle, data, canManage, saving, run }: { vehicle: FleetVehicle; data: FleetEnterpriseData; canManage: boolean; saving: boolean; run: (action: () => Promise<unknown>, success: string) => Promise<void> }) {',
              'function PartnerVehicle({ vehicle, data, canManage, activeAction, busyMessage, run }: { vehicle: FleetVehicle; data: FleetEnterpriseData; canManage: boolean; activeAction: { key: string; message: string } | null; busyMessage: string; run: (actionKey: string, message: string, action: () => Promise<unknown>, success: string) => Promise<void> }) {\n  const saving = activeAction !== null;',
          )
          replace(
              'void run(() => updateFleetVehicleProfile(',
              'void run(`profile:${vehicle.vehicle_id}`, "Saving the vehicle compliance profile. Other fleet actions are temporarily locked until this update finishes.", () => updateFleetVehicleProfile(',
          )
          replace(
              'void run(() => createMaintenanceRecord(',
              'void run(`maintenance:${vehicle.vehicle_id}`, "Recording vehicle maintenance. Other fleet actions are temporarily locked until this update finishes.", () => createMaintenanceRecord(',
          )
          replace(
              '<form onSubmit={profile} className="mt-3 grid gap-3">',
              '<form onSubmit={profile} aria-busy={activeAction?.key === `profile:${vehicle.vehicle_id}`} className="mt-3 grid gap-3">',
          )
          replace(
              '<button disabled={saving} className="min-h-12 bg-emerald-700 px-4 text-xs font-semibold text-white disabled:opacity-40">Save profile</button>',
              '<button disabled={saving} aria-describedby={saving ? "partner-fleet-action-guidance" : undefined} title={saving ? busyMessage : `Save ${vehicle.plate_number} compliance profile`} className="min-h-12 bg-emerald-700 px-4 text-xs font-semibold text-white disabled:opacity-40">{activeAction?.key === `profile:${vehicle.vehicle_id}` ? "Saving profile…" : "Save profile"}</button>',
          )
          replace(
              '<form onSubmit={maintenance} className="mt-3 grid gap-3">',
              '<form onSubmit={maintenance} aria-busy={activeAction?.key === `maintenance:${vehicle.vehicle_id}`} className="mt-3 grid gap-3">',
          )
          replace(
              '<button disabled={saving} className="min-h-12 bg-asphalt px-4 text-xs font-semibold text-white disabled:opacity-40">Save maintenance</button>',
              '<button disabled={saving} aria-describedby={saving ? "partner-fleet-action-guidance" : undefined} title={saving ? busyMessage : `Save ${vehicle.plate_number} maintenance record`} className="min-h-12 bg-asphalt px-4 text-xs font-semibold text-white disabled:opacity-40">{activeAction?.key === `maintenance:${vehicle.vehicle_id}` ? "Saving maintenance…" : "Save maintenance"}</button>',
          )

          path.write_text(source)
          Path(".github/workflows/patch-partner-fleet-guidance.yml").unlink()
          PY
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/partner/PartnerFleetPanel.tsx .github/workflows/patch-partner-fleet-guidance.yml
          git commit -m "Explain Partner fleet workflow locks"
          git push origin HEAD:fix/partner-fleet-action-guidance

name: Apply mobile Driver commission payment

on:
  push:
    branches:
      - feat/mobile-driver-commission-payment
    paths:
      - .github/workflows/apply-mobile-driver-commission-payment.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-commission-payment
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Integrate commission payment UI
        run: node scripts/apply-mobile-driver-commission-payment.mjs

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile auth, operations, wallet and commission payment
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-mobile-driver-commission-payment.yml scripts/apply-mobile-driver-commission-payment.mjs

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app
          git commit -m "Add mobile Driver commission payment submission"
          git push origin HEAD:feat/mobile-driver-commission-payment

name: Patch Admin fleet action guidance

on:
  push:
    branches:
      - fix/admin-fleet-action-guidance
    paths:
      - .github/workflows/patch-admin-fleet-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-fleet-action-guidance
      - name: Apply focused Admin fleet guidance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if old not in source:
                  raise SystemExit(f"Missing source fragment: {label}")
              return source.replace(old, new, 1)

          source_path = Path("src/pages/AdminFleetMaintenance.tsx")
          source = source_path.read_text()

          source = replace_once(
              source,
              'export function AdminFleetMaintenance({ fixture }: { fixture?: FleetEnterpriseData } = {}) {',
              'export function AdminFleetMaintenance({ fixture, executeAction = (action) => action() }: { fixture?: FleetEnterpriseData; executeAction?: (action: () => Promise<unknown>) => Promise<unknown> } = {}) {',
              'component signature',
          )
          source = replace_once(
              source,
              '  const [saving, setSaving] = useState(false);',
              '  const [activeAction, setActiveAction] = useState<null | { key: string; message: string }>(null);\n  const saving = activeAction !== null;\n  const busyMessage = activeAction?.message ?? "";',
              'saving state',
          )
          source = replace_once(
              source,
              '''  async function run(action: () => Promise<unknown>, success: string) {
    setSaving(true); setError(""); setNotice("");
    try { await action(); setNotice(success); setModal(null); setSelected(null); await load(); }
    catch (actionError) { setError(actionError instanceof Error ? actionError.message : "Fleet action could not be completed."); }
    finally { setSaving(false); }
  }''',
              '''  async function run(actionKey: string, message: string, action: () => Promise<unknown>, success: string) {
    if (activeAction) return;
    setActiveAction({ key: actionKey, message }); setError(""); setNotice("");
    try { await executeAction(action); setNotice(success); setModal(null); setSelected(null); await load(); }
    catch (actionError) { setError(actionError instanceof Error ? actionError.message : "Fleet action could not be completed."); }
    finally { setActiveAction(null); }
  }''',
              'run helper',
          )
          source = replace_once(
              source,
              '    void run(() => updateMaintenanceStatus(recordId, nextStatus, reason), "Maintenance status updated.");',
              '    void run(`maintenance-status:${recordId}:${nextStatus}`, `Changing maintenance status to ${label(nextStatus)}. Other fleet actions are temporarily locked until this update finishes.`, () => updateMaintenanceStatus(recordId, nextStatus, reason), "Maintenance status updated.");',
              'maintenance status action',
          )
          source = replace_once(
              source,
              '<main className="mx-auto max-w-[1500px] overflow-x-hidden px-3 py-6 sm:px-7 lg:px-10 lg:py-10" data-testid="fleet-enterprise-page">',
              '<main className="mx-auto max-w-[1500px] overflow-x-hidden px-3 py-6 sm:px-7 lg:px-10 lg:py-10" data-testid="fleet-enterprise-page" aria-busy={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined}>',
              'main busy state',
          )
          source = replace_once(
              source,
              '      {error && <div role="alert"',
              '      {saving && <p id="admin-fleet-action-guidance" role="status" aria-live="polite" className="mt-5 break-words border border-sky-700/25 bg-sky-50 p-4 text-sm font-semibold text-sky-900">{busyMessage}</p>}\n      {error && <div role="alert"',
              'visible busy guidance',
          )
          source = replace_once(
              source,
              '<button type="button" onClick={() => void load()} disabled={loading} className="min-h-12 border border-asphalt px-4 py-3 text-xs font-semibold disabled:opacity-50">{loading ? "Refreshing…" : "Refresh"}</button>',
              '<button type="button" onClick={() => void load()} disabled={loading || saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Refresh fleet data"} className="min-h-12 border border-asphalt px-4 py-3 text-xs font-semibold disabled:opacity-50">{loading ? "Refreshing…" : "Refresh"}</button>',
              'refresh lock',
          )
          source = replace_once(
              source,
              '<button type="button" onClick={() => setModal("branch")} className="min-h-12 border border-asphalt px-4 py-3 text-xs font-semibold">Add branch</button>',
              '<button type="button" onClick={() => setModal("branch")} disabled={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Add fleet branch"} className="min-h-12 border border-asphalt px-4 py-3 text-xs font-semibold disabled:opacity-40">Add branch</button>',
              'branch opener lock',
          )
          source = replace_once(
              source,
              '<button type="button" onClick={() => setModal("vehicle")} className="col-span-2 min-h-12 bg-asphalt px-5 py-3 text-xs font-semibold text-white sm:col-auto">Add vehicle</button>',
              '<button type="button" onClick={() => setModal("vehicle")} disabled={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Add fleet vehicle"} className="col-span-2 min-h-12 bg-asphalt px-5 py-3 text-xs font-semibold text-white disabled:opacity-40 sm:col-auto">Add vehicle</button>',
              'vehicle opener lock',
          )
          source = replace_once(
              source,
              'vehicle={vehicle} drivers={data.drivers} saving={saving} records=',
              'vehicle={vehicle} drivers={data.drivers} activeAction={activeAction} busyMessage={busyMessage} records=',
              'vehicle card props',
          )
          source = replace_once(
              source,
              'onStatus={(next, reason) => run(() => setTruckOperationalStatus(vehicle.vehicle_id, next, reason), `${vehicle.plate_number} status updated.`)}',
              'onStatus={(next, reason) => run(`status:${vehicle.vehicle_id}`, `Updating ${vehicle.plate_number} operational status. Other fleet actions are temporarily locked until this update finishes.`, () => setTruckOperationalStatus(vehicle.vehicle_id, next, reason), `${vehicle.plate_number} status updated.`)}',
              'status action',
          )
          source = replace_once(
              source,
              'onAssign={(driverId, reason) => run(() => assignFleetDriver(vehicle.vehicle_id, driverId, reason), `${vehicle.plate_number} driver assignment updated.`)}',
              'onAssign={(driverId, reason) => run(`driver:${vehicle.vehicle_id}`, `Updating ${vehicle.plate_number} driver assignment. Other fleet actions are temporarily locked until this update finishes.`, () => assignFleetDriver(vehicle.vehicle_id, driverId, reason), `${vehicle.plate_number} driver assignment updated.`)}',
              'driver action',
          )
          source = replace_once(
              source,
              'function VehicleCard({ vehicle, drivers, saving, records, onProfile, onMaintenance, onStatus, onAssign }: { vehicle: FleetVehicle; drivers: FleetEnterpriseData["drivers"]; saving: boolean;',
              'function VehicleCard({ vehicle, drivers, activeAction, busyMessage, records, onProfile, onMaintenance, onStatus, onAssign }: { vehicle: FleetVehicle; drivers: FleetEnterpriseData["drivers"]; activeAction: { key: string; message: string } | null; busyMessage: string;',
              'vehicle card signature',
          )
          source = replace_once(
              source,
              '  const [nextStatus, setNextStatus] = useState<TruckOperationalStatus>(vehicle.status);',
              '  const saving = activeAction !== null;\n  const [nextStatus, setNextStatus] = useState<TruckOperationalStatus>(vehicle.status);',
              'vehicle card saving state',
          )
          source = replace_once(
              source,
              '    ? "Saving fleet change."',
              '    ? busyMessage',
              'vehicle busy reason',
          )
          source = replace_once(
              source,
              '<div className="mt-4 grid grid-cols-2 gap-2"><button onClick={onProfile} className="min-h-11 border border-asphalt px-3 text-xs font-semibold">Edit profile</button><button onClick={onMaintenance} className="min-h-11 bg-asphalt px-3 text-xs font-semibold text-white">Maintenance</button></div>',
              '<div className="mt-4 grid grid-cols-2 gap-2"><button onClick={onProfile} disabled={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Edit compliance profile"} className="min-h-11 border border-asphalt px-3 text-xs font-semibold disabled:opacity-40">Edit profile</button><button onClick={onMaintenance} disabled={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Add maintenance record"} className="min-h-11 bg-asphalt px-3 text-xs font-semibold text-white disabled:opacity-40">Maintenance</button></div>',
              'vehicle secondary actions',
          )
          source = replace_once(
              source,
              'maxLength={500} aria-describedby={guidanceId}',
              'maxLength={500} disabled={saving} title={saving ? busyMessage : "Required audit reason"} aria-describedby={guidanceId}',
              'reason input lock',
          )
          source = replace_once(
              source,
              '<select value={nextStatus} onChange={(event) => setNextStatus(event.target.value as TruckOperationalStatus)} className=',
              '<select value={nextStatus} onChange={(event) => setNextStatus(event.target.value as TruckOperationalStatus)} disabled={saving} title={saving ? busyMessage : "Choose operational status"} aria-describedby={guidanceId} className=',
              'status select lock',
          )
          source = replace_once(
              source,
              '>Apply status</button>',
              '>{activeAction?.key === `status:${vehicle.vehicle_id}` ? "Updating status…" : "Apply status"}</button>',
              'status action label',
          )
          source = replace_once(
              source,
              '<select value={driver} onChange={(event) => setDriver(event.target.value)} className=',
              '<select value={driver} onChange={(event) => setDriver(event.target.value)} disabled={saving} title={saving ? busyMessage : "Choose assigned driver"} aria-describedby={guidanceId} className=',
              'driver select lock',
          )
          source = replace_once(
              source,
              '>Apply driver</button>',
              '>{activeAction?.key === `driver:${vehicle.vehicle_id}` ? "Updating driver…" : "Apply driver"}</button>',
              'driver action label',
          )
          source = replace_once(
              source,
              '<button disabled={saving} onClick={() => changeMaintenanceStatus(record.id, "in_progress")} className="min-h-11 border border-amber-dim px-3 text-xs font-semibold text-amber-dim disabled:opacity-40">Start work</button>',
              '<button disabled={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Start maintenance work"} onClick={() => changeMaintenanceStatus(record.id, "in_progress")} className="min-h-11 border border-amber-dim px-3 text-xs font-semibold text-amber-dim disabled:opacity-40">{activeAction?.key === `maintenance-status:${record.id}:in_progress` ? "Starting work…" : "Start work"}</button>',
              'start maintenance action',
          )
          source = replace_once(
              source,
              '<button disabled={saving} onClick={() => changeMaintenanceStatus(record.id, "completed")} className="min-h-11 bg-emerald-700 px-3 text-xs font-semibold text-white disabled:opacity-40">Complete</button>',
              '<button disabled={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Complete maintenance work"} onClick={() => changeMaintenanceStatus(record.id, "completed")} className="min-h-11 bg-emerald-700 px-3 text-xs font-semibold text-white disabled:opacity-40">{activeAction?.key === `maintenance-status:${record.id}:completed` ? "Completing…" : "Complete"}</button>',
              'complete maintenance action',
          )
          source = replace_once(
              source,
              '<button disabled={saving} onClick={() => changeMaintenanceStatus(record.id, "cancelled")} className="min-h-11 border border-route px-3 text-xs font-semibold text-route disabled:opacity-40">Cancel</button>',
              '<button disabled={saving} aria-describedby={saving ? "admin-fleet-action-guidance" : undefined} title={saving ? busyMessage : "Cancel maintenance work"} onClick={() => changeMaintenanceStatus(record.id, "cancelled")} className="min-h-11 border border-route px-3 text-xs font-semibold text-route disabled:opacity-40">{activeAction?.key === `maintenance-status:${record.id}:cancelled` ? "Cancelling…" : "Cancel"}</button>',
              'cancel maintenance action',
          )
          source = replace_once(source, '<VehicleModal branches={data.branches} saving={saving}', '<VehicleModal branches={data.branches} saving={saving} busyMessage={busyMessage}', 'vehicle modal props')
          source = replace_once(source, '<BranchModal saving={saving}', '<BranchModal saving={saving} busyMessage={busyMessage}', 'branch modal props')
          source = replace_once(source, '<MaintenanceModal vehicles={data.vehicles} selected={selected} saving={saving}', '<MaintenanceModal vehicles={data.vehicles} selected={selected} saving={saving} busyMessage={busyMessage}', 'maintenance modal props')
          source = replace_once(source, '<ProfileModal vehicle={selected} branches={data.branches} saving={saving}', '<ProfileModal vehicle={selected} branches={data.branches} saving={saving} busyMessage={busyMessage}', 'profile modal props')
          source = replace_once(source, 'onSubmit={(form) => run(() => createFleetVehicle(', 'onSubmit={(form) => run("register_vehicle", "Registering a fleet vehicle. Other fleet actions are temporarily locked until this update finishes.", () => createFleetVehicle(', 'vehicle modal action')
          source = replace_once(source, 'onSubmit={(form) => run(() => createFleetBranch(', 'onSubmit={(form) => run("create_branch", "Creating a fleet branch. Other fleet actions are temporarily locked until this update finishes.", () => createFleetBranch(', 'branch modal action')
          source = replace_once(source, 'onSubmit={(form) => run(() => createMaintenanceRecord(', 'onSubmit={(form) => run("create_maintenance", "Recording fleet maintenance. Other fleet actions are temporarily locked until this update finishes.", () => createMaintenanceRecord(', 'maintenance modal action')
          source = replace_once(source, 'onSubmit={(form) => run(() => updateFleetVehicleProfile(', 'onSubmit={(form) => run(`profile:${selected.vehicle_id}`, `Saving ${selected.plate_number} compliance profile. Other fleet actions are temporarily locked until this update finishes.`, () => updateFleetVehicleProfile(', 'profile modal action')

          old_modal = '''function Modal({ title, detail, saving, onClose, onSubmit, children }: { title: string; detail: string; saving: boolean; onClose: () => void; onSubmit: (form: FormData) => void; children: React.ReactNode }) {
  return <div className="fixed inset-0 z-[100] grid place-items-center overflow-y-auto bg-asphalt/75 p-3" role="dialog" aria-modal="true" aria-label={title}><form onSubmit={(event) => { event.preventDefault(); onSubmit(new FormData(event.currentTarget)); }} className="my-auto max-h-[95vh] w-full max-w-3xl overflow-y-auto rounded-[24px] bg-white p-5 shadow-2xl sm:p-8"><div className="flex items-start justify-between gap-4"><div><h2 className="font-display text-2xl font-bold">{title}</h2><p className="mt-2 text-xs leading-5 text-steel">{detail}</p></div><button type="button" onClick={onClose} className="grid min-h-11 min-w-11 place-items-center rounded-full text-2xl" aria-label="Close">×</button></div><div className="mt-6 grid gap-4 sm:grid-cols-2">{children}</div><div className="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><button type="button" onClick={onClose} className="min-h-12 border border-asphalt px-5 font-semibold">Cancel</button><button disabled={saving} className="min-h-12 bg-emerald-700 px-6 font-semibold text-white disabled:opacity-40">{saving ? "Saving…" : "Save"}</button></div></form></div>;
}'''
          new_modal = '''function Modal({ title, detail, saving, busyMessage, busyLabel, onClose, onSubmit, children }: { title: string; detail: string; saving: boolean; busyMessage: string; busyLabel: string; onClose: () => void; onSubmit: (form: FormData) => void; children: React.ReactNode }) {
  const guidanceId = "admin-fleet-modal-action-guidance";
  return <div className="fixed inset-0 z-[100] grid place-items-center overflow-y-auto bg-asphalt/75 p-3" role="dialog" aria-modal="true" aria-label={title}><form aria-busy={saving} aria-describedby={saving ? guidanceId : undefined} onSubmit={(event) => { event.preventDefault(); if (saving) return; onSubmit(new FormData(event.currentTarget)); }} className="my-auto max-h-[95vh] w-full max-w-3xl overflow-y-auto rounded-[24px] bg-white p-5 shadow-2xl sm:p-8"><div className="flex items-start justify-between gap-4"><div><h2 className="font-display text-2xl font-bold">{title}</h2><p className="mt-2 text-xs leading-5 text-steel">{detail}</p></div><button type="button" onClick={onClose} disabled={saving} aria-describedby={saving ? guidanceId : undefined} title={saving ? busyMessage : "Close dialog"} className="grid min-h-11 min-w-11 place-items-center rounded-full text-2xl disabled:opacity-40" aria-label="Close">×</button></div>{saving && <p id={guidanceId} role="status" aria-live="polite" className="mt-5 break-words border border-sky-700/25 bg-sky-50 p-4 text-sm font-semibold text-sky-900">{busyMessage}</p>}<fieldset disabled={saving} className="mt-6 grid gap-4 sm:grid-cols-2">{children}</fieldset><div className="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><button type="button" onClick={onClose} disabled={saving} aria-describedby={saving ? guidanceId : undefined} title={saving ? busyMessage : "Cancel and close"} className="min-h-12 border border-asphalt px-5 font-semibold disabled:opacity-40">Cancel</button><button disabled={saving} aria-describedby={saving ? guidanceId : undefined} title={saving ? busyMessage : "Save fleet changes"} className="min-h-12 bg-emerald-700 px-6 font-semibold text-white disabled:opacity-40">{saving ? busyLabel : "Save"}</button></div></form></div>;
}'''
          source = replace_once(source, old_modal, new_modal, 'modal busy contract')

          source = replace_once(source, 'function VehicleModal({ branches, saving, onClose, onSubmit }: { branches: FleetBranch[]; saving: boolean;', 'function VehicleModal({ branches, saving, busyMessage, onClose, onSubmit }: { branches: FleetBranch[]; saving: boolean; busyMessage: string;', 'vehicle modal signature')
          source = replace_once(source, 'detail="Plate numbers are normalized and unique across HALLO and Partner fleets." saving={saving} onClose=', 'detail="Plate numbers are normalized and unique across HALLO and Partner fleets." saving={saving} busyMessage={busyMessage} busyLabel="Registering vehicle…" onClose=', 'vehicle modal forwarding')
          source = replace_once(source, 'function BranchModal({ saving, onClose, onSubmit }: { saving: boolean;', 'function BranchModal({ saving, busyMessage, onClose, onSubmit }: { saving: boolean; busyMessage: string;', 'branch modal signature')
          source = replace_once(source, 'detail="Branch codes are unique within the HALLO company fleet." saving={saving} onClose=', 'detail="Branch codes are unique within the HALLO company fleet." saving={saving} busyMessage={busyMessage} busyLabel="Creating branch…" onClose=', 'branch modal forwarding')
          source = replace_once(source, 'function MaintenanceModal({ vehicles, selected, saving, onClose, onSubmit }: { vehicles: FleetVehicle[]; selected: FleetVehicle | null; saving: boolean;', 'function MaintenanceModal({ vehicles, selected, saving, busyMessage, onClose, onSubmit }: { vehicles: FleetVehicle[]; selected: FleetVehicle | null; saving: boolean; busyMessage: string;', 'maintenance modal signature')
          source = replace_once(source, 'detail="Service history stays immutable; status changes are recorded in fleet audit." saving={saving} onClose=', 'detail="Service history stays immutable; status changes are recorded in fleet audit." saving={saving} busyMessage={busyMessage} busyLabel="Saving maintenance…" onClose=', 'maintenance modal forwarding')
          source = replace_once(source, 'function ProfileModal({ vehicle, branches, saving, onClose, onSubmit }: { vehicle: FleetVehicle; branches: FleetBranch[]; saving: boolean;', 'function ProfileModal({ vehicle, branches, saving, busyMessage, onClose, onSubmit }: { vehicle: FleetVehicle; branches: FleetBranch[]; saving: boolean; busyMessage: string;', 'profile modal signature')
          source = replace_once(source, 'detail="Expiry, ownership, branch and odometer changes require an audit reason." saving={saving} onClose=', 'detail="Expiry, ownership, branch and odometer changes require an audit reason." saving={saving} busyMessage={busyMessage} busyLabel="Saving profile…" onClose=', 'profile modal forwarding')
          source_path.write_text(source)

          smoke_path = Path("scripts/fleet-enterprise-e2e-smoke.mjs")
          smoke = smoke_path.read_text()
          smoke = replace_once(smoke, 'React.createElement(AdminFleetMaintenance,{fixture})', 'React.createElement(AdminFleetMaintenance,{fixture,executeAction:()=>new Promise(()=>{})})', 'Admin fleet smoke executor')
          smoke = replace_once(
              smoke,
              'const partnerPanel=document.querySelector(\'[data-testid="partner-fleet-panel"]\');',
              '''const adminPage=document.querySelector('[data-testid="fleet-enterprise-page"]');
const addVehicleButton=Array.from(adminPage?.querySelectorAll("button")??[]).find((button)=>button.textContent.trim()==="Add vehicle");
if(!adminPage||!addVehicleButton)throw new Error("Admin fleet Add vehicle control not found.");
addVehicleButton.click();
await new Promise((resolve)=>setTimeout(resolve,50));
const adminDialog=document.querySelector('[role="dialog"][aria-label="Register fleet vehicle"]');
const adminForm=adminDialog?.querySelector("form");
const adminSubmit=Array.from(adminForm?.querySelectorAll("button")??[]).find((button)=>button.textContent.trim()==="Save");
if(!adminDialog||!adminForm||!adminSubmit)throw new Error("Admin fleet registration modal not found.");
adminForm.querySelector('input[name="plate"]').value="ET-01-ADMIN-LOCK";
adminForm.querySelector('input[name="vehicleType"]').value="Admin enterprise test truck";
adminForm.requestSubmit(adminSubmit);
await new Promise((resolve)=>setTimeout(resolve,100));
const adminGuidance=document.getElementById("admin-fleet-action-guidance");
const adminModalGuidance=document.getElementById("admin-fleet-modal-action-guidance");
const adminFields=Array.from(adminForm.querySelectorAll("input,select,textarea"));
const adminModalButtons=Array.from(adminForm.querySelectorAll("button"));
document.documentElement.dataset.adminBusyGuidance=String(adminGuidance?.textContent.includes("Registering a fleet vehicle. Other fleet actions are temporarily locked until this update finishes."));
document.documentElement.dataset.adminPageBusy=String(adminPage.getAttribute("aria-busy")==="true");
document.documentElement.dataset.adminModalBusy=String(adminForm.getAttribute("aria-busy")==="true"&&adminModalGuidance?.textContent.includes("Registering a fleet vehicle."));
document.documentElement.dataset.adminFieldsDisabled=String(adminFields.length>0&&adminFields.every((field)=>field.matches(":disabled")));
document.documentElement.dataset.adminDescribedDisabled=String(adminModalButtons.length===3&&adminModalButtons.every((button)=>button.matches(":disabled")&&button.getAttribute("aria-describedby")==="admin-fleet-modal-action-guidance"&&button.getAttribute("title")?.includes("temporarily locked")));
document.documentElement.dataset.adminActionLabel=String(adminSubmit.textContent.trim()==="Registering vehicle…");
const partnerPanel=document.querySelector('[data-testid="partner-fleet-panel"]');''',
              'Admin fleet smoke interaction',
          )
          smoke = replace_once(

name: Patch Admin fleet action guidance

on:
  push:
    branches:
      - fix/admin-fleet-action-guidance
    paths:
      - .github/workflows/patch-admin-fleet-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-fleet-action-guidance
      - name: Apply focused Admin fleet guidance patch
        run: python .github/scripts/patch_admin_fleet_guidance.py
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminFleetMaintenance.tsx scripts/fleet-enterprise-e2e-smoke.mjs tests/regression/dead-route-controls.test.ts .github/workflows/patch-admin-fleet-guidance.yml .github/scripts/patch_admin_fleet_guidance.py
          git commit -m "Explain Admin fleet workflow locks"
          git push origin HEAD:fix/admin-fleet-action-guidance

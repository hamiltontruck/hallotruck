name: Fix Admin fleet smoke assertion

on:
  push:
    branches:
      - fix/admin-fleet-action-guidance
    paths:
      - .github/workflows/fix-admin-fleet-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-fleet-action-guidance
      - name: Preserve active-trip coverage before busy action
        run: python .github/scripts/fix_admin_fleet_smoke.py
      - name: Commit smoke assertion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fleet-enterprise-e2e-smoke.mjs tests/regression/dead-route-controls.test.ts .github/scripts/fix_admin_fleet_smoke.py .github/workflows/fix-admin-fleet-smoke.yml
          git commit -m "Preserve Admin fleet active-trip smoke coverage"
          git push origin HEAD:fix/admin-fleet-action-guidance

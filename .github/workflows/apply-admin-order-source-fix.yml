name: Apply Admin Order Source Fix

on:
  push:
    branches:
      - fix/admin-order-source-rendering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-order-source-rendering
          fetch-depth: 0

      - name: Apply source-level Admin order fix
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('src/pages/SmartLogistics.tsx')
          service_path = Path('src/services/admin.service.ts')
          page = page_path.read_text()
          service = service_path.read_text()

          old_import = 'openDeliveryProof, openPaymentReceipt, printInvoice, recordPayment, submitDeliveryProof'
          new_import = 'openDeliveryProof, openPaymentReceipt, printInvoice, submitDeliveryProof'
          if old_import not in page:
              raise SystemExit('recordPayment import marker not found')
          page = page.replace(old_import, new_import, 1)

          order_row_start = page.index('function OrderRow(')
          order_row_end = page.index('\nfunction includesQuery', order_row_start)
          replacement_order_row = '''function OrderRow({ order:o, onManage }: { order: AdminOrder; onManage?: (order:AdminOrder)=>void }) {
            const color = o.status === "cancelled" ? "bg-red-100 text-red-800" : o.status === "delivered" ? "bg-emerald-100 text-emerald-800" : o.status === "in_transit" ? "bg-amber/20 text-amber-dim" : o.status === "accepted" ? "bg-sky-100 text-sky-800" : "bg-asphalt/5 text-steel";
            return <div className="p-4 sm:px-6 grid grid-cols-[1fr_auto] sm:grid-cols-[100px_1fr_auto_auto_auto] items-center gap-3 sm:gap-5"><span className="font-mono text-xs font-semibold">{o.tracking_id}</span><div className="order-3 sm:order-none col-span-2 sm:col-span-1"><p className="text-sm font-medium flex items-center gap-1.5"><Icon name="pin" className="w-3.5 h-3.5 text-amber" />{o.pickup_address} <span className="text-steel">→</span> {o.dropoff_address}</p><p className="text-[11px] text-steel mt-1">{o.customer_name ?? "Customer"} · {o.cargo_description ?? o.vehicle_type}</p><p className="text-[11px] font-semibold text-asphalt mt-1">Driver / plate: {o.assignment_label || "Driver and truck not assigned"}</p></div><span className="hidden sm:block font-mono text-xs">ETB {Number(o.price_etb ?? 0).toLocaleString()}</span><span className={`text-[10px] font-semibold px-2.5 py-1.5 capitalize ${color}`}>{o.status.replace("_", " ")}</span>{onManage&&<button onClick={()=>onManage(o)} className="text-xs font-semibold text-amber-dim">Manage</button>}</div>;
          }
          '''
          page = page[:order_row_start] + replacement_order_row + page[order_row_end:]

          page_lines = page.splitlines()
          page_lines = [line for line in page_lines if not line.startswith('  async function pay(')]
          page_lines = [line for line in page_lines if '<form onSubmit={pay}' not in line]
          page = '\n'.join(page_lines) + '\n'

          assignment_marker = '  const truck=trucks.find(t=>t.id===order.truck_id); const driver=drivers.find(d=>d.id===order.driver_id);\n'
          if assignment_marker not in page:
              raise SystemExit('Manage Order assignment marker not found')
          assignment_logic = assignment_marker + '''  const assignedDriverName=driver?.full_name?.trim()||driver?.phone?.trim()||order.driver_name||"Not assigned";
            const assignedPlate=truck?.plate_number?.trim()||order.plate_number||"Not assigned";
          '''
          page = page.replace(assignment_marker, assignment_logic, 1)

          manage_start = page.index('function ManageOrderModal')
          before_manage = page[:manage_start]
          manage = page[manage_start:]
          workflow_marker = '    <div className="mt-6 border border-asphalt/10 p-4">'
          if workflow_marker not in manage:
              raise SystemExit('Manage Order workflow card marker not found')
          assignment_card = '''    <div className="mt-5 grid gap-3 border border-asphalt/10 bg-[#f5f3ed] p-4 sm:grid-cols-2">
              <div><p className="font-mono text-[10px] uppercase tracking-[.14em] text-steel">Route</p><p className="mt-2 text-sm font-semibold">{order.pickup_address} <span className="text-steel">→</span> {order.dropoff_address}</p></div>
              <div><p className="font-mono text-[10px] uppercase tracking-[.14em] text-steel">Assigned vehicle</p><p className="mt-2 text-sm font-semibold">{assignedDriverName}</p><p className="mt-1 text-xs text-steel">Plate {assignedPlate} · {truck?.vehicle_type ?? order.vehicle_type}</p></div>
            </div>
          '''
          manage = manage.replace(workflow_marker, assignment_card + workflow_marker, 1)
          page = before_manage + manage

          old_cargo_projection = '      cargo_description: `${cargoLabel} · ${assignmentLabel}`,'
          new_cargo_projection = '      cargo_description: cargoLabel,'
          if old_cargo_projection not in service:
              raise SystemExit('Admin order cargo projection marker not found')
          service = service.replace(old_cargo_projection, new_cargo_projection, 1)

          required = [
              'Driver / plate: {o.assignment_label',
              'Assigned vehicle',
              'Plate {assignedPlate}',
              'Payment evidence',
              'Invoice / receipt PDF',
          ]
          for marker in required:
              if marker not in page:
                  raise SystemExit(f'missing expected marker: {marker}')
          forbidden = ['Payment & verification', '<form onSubmit={pay}', 'async function pay(', 'recordPayment,']
          for marker in forbidden:
              if marker in page:
                  raise SystemExit(f'obsolete marker remains: {marker}')

          page_path.write_text(page)
          service_path.write_text(service)
          PY

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SmartLogistics.tsx src/services/admin.service.ts
          git commit -m "Render Admin order assignment and remove manual payment form [codemod]"
          git push origin HEAD:fix/admin-order-source-rendering

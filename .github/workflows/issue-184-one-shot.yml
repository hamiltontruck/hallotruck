name: Issue 184 One Shot

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/issue-184-apply-patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-184-one-shot.yml scripts/issue-184-apply-patch.py
          git add src/pages/SmartLogistics.tsx tests/regression/admin-order-assignment-evidence.test.ts
          git commit -m "feat: add guarded cancelled order deletion UI"
          git push

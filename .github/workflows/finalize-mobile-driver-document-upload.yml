name: Finalize mobile Driver document upload

on:
  push:
    branches:
      - feat/mobile-driver-document-upload
    paths:
      - .github/workflows/finalize-mobile-driver-document-upload.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-driver-document-upload
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Apply profile integration
        run: python .github/scripts/finalize-mobile-driver-document-upload.py

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Test mobile app
        working-directory: apps/mobile-app
        run: npm test

      - name: Build mobile app
        working-directory: apps/mobile-app
        run: npm run build

      - name: Remove temporary integration files
        run: |
          rm .github/workflows/apply-mobile-driver-document-upload.yml
          rm .github/workflows/retry-mobile-driver-document-upload.yml
          rm .github/workflows/finalize-mobile-driver-document-upload.yml
          rm .github/scripts/finalize-mobile-driver-document-upload.py

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app .github
          git commit -m "Add production mobile Driver document upload"
          git push origin HEAD:feat/mobile-driver-document-upload

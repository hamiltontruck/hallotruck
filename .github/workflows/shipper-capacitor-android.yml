name: HALLO Shipper Capacitor Android

on:
  pull_request:
    paths:
      - "apps/customer-mobile-app/**"
      - ".github/workflows/shipper-capacitor-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/customer-mobile-app/**"
      - ".github/workflows/shipper-capacitor-android.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_ci_only_not_a_secret
  VITE_MAPTILER_KEY: ci-maptiler-key

jobs:
  shipper-capacitor-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/customer-mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/customer-mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, tests, and production build
        run: npm run test:ci

      - name: Build and sync the checked-in Android project
        run: npm run android:sync

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Android unit tests, lint, and debug APK
        working-directory: apps/customer-mobile-app/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload HALLO Shipper debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hallo-shipper-capacitor-debug
          path: apps/customer-mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

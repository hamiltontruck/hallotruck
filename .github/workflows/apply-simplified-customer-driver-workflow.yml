# Final atomic Finish Trip validation run.
name: Apply simplified customer-driver workflow

on:
  workflow_dispatch:
  push:
    branches:
      - fix/driver-trip-history-earned-money
    paths:
      - scripts/apply-simplified-customer-driver-workflow.mjs
      - .github/workflows/apply-simplified-customer-driver-workflow.yml
      - .github/apply-simplified-workflow/atomic.py
      - .github/apply-simplified-workflow/final_assertions.py

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/driver-trip-history-earned-money
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair embedded React templates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-simplified-customer-driver-workflow.mjs')
          source = path.read_text()
          for token in [
              '${quote.toLocaleString()}',
              '${cargoText.quoteUnavailable}',
              '${quoteError}',
              '${cargoText.pricing}',
              '${cargoText.latestRate}',
              '${paymentMethod === "cash" ? "border-asphalt bg-asphalt text-white" : "border-asphalt/15 bg-white"}',
              '${paymentMethod === "bank_telebirr" ? "border-asphalt bg-asphalt text-white" : "border-asphalt/15 bg-white"}',
          ]:
              source = source.replace(token, '\\' + token)
          path.write_text(source)
          PY

      - name: Apply workflow changes
        run: node scripts/apply-simplified-customer-driver-workflow.mjs

      - name: Align atomic completion and compatibility
        shell: bash
        run: |
          python .github/apply-simplified-workflow/align.py
          python - <<'PY'
          from pathlib import Path
          import re

          cargo = Path('src/services/customer-cargo.service.ts')
          source = cargo.read_text()
          source = source.replace('paymentMethod: "cash" | "bank_telebirr";', 'paymentMethod?: "cash" | "bank_telebirr";')
          source = source.replace('selected_payment_method: input.paymentMethod,', 'selected_payment_method: input.paymentMethod ?? "cash",')
          cargo.write_text(source)

          driver = Path('src/pages/DriverPaymentCollection.tsx')
          source = driver.read_text()
          source = source.replace('  submitDriverCollectedPayment,\n', '')
          source = re.sub(
              r'\n\s*await submitDriverCollectedPayment\(\{.*?\n\s*\}\);\n\s*await recordDriverTripPaymentResult',
              '\n      await recordDriverTripPaymentResult',
              source,
              count=1,
              flags=re.S,
          )
          driver.write_text(source)

          test = Path('tests/regression/simplified-customer-driver-workflow.test.ts')
          source = test.read_text().replace('/Bank / Telebirr/', '/Bank \\/ Telebirr/')
          test.write_text(source)
          PY
          python .github/apply-simplified-workflow/atomic.py
          python .github/apply-simplified-workflow/final_assertions.py
          rm -rf .github/apply-simplified-workflow .github/apply-simplified-workflow-b64 .github/regression-output.txt

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm run test:regression

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: Browser smoke tests
        run: npm run test:e2e-smoke
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Implement simplified Customer-Driver completion workflow"
          git push origin HEAD:fix/driver-trip-history-earned-money

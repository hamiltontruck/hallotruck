<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Cargo-plate badge: same corner-notch motif used for tracking IDs across the app -->
  <rect x="8" y="8" width="240" height="240" rx="28" fill="#1C2128"/>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="none" stroke="#E8A33D" stroke-width="4"/>

  <!-- corner notches -->
  <path d="M8 40 V8 H40" fill="none" stroke="#E8A33D" stroke-width="4"/>
  <path d="M248 40 V8 H216" fill="none" stroke="#E8A33D" stroke-width="4"/>
  <path d="M8 216 V248 H40" fill="none" stroke="#E8A33D" stroke-width="4"/>
  <path d="M248 216 V248 H216" fill="none" stroke="#E8A33D" stroke-width="4"/>

  <!-- route line (the road) -->
  <line x1="36" y1="200" x2="220" y2="200" stroke="#5B6472" stroke-width="6"/>
  <line x1="36" y1="200" x2="220" y2="200" stroke="#E8A33D" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- truck glyph: cab + trailer silhouette, riding the route line -->
  <g fill="#F3EEE3">
    <!-- trailer body -->
    <rect x="52" y="100" width="94" height="60" rx="4"/>
    <!-- cab -->
    <path d="M146 120 h34 l18 24 v16 h-52 z"/>
    <!-- windshield cut -->
    <path d="M168 124 l12 16 h-12 z" fill="#1C2128"/>
  </g>

  <!-- wheels -->
  <circle cx="82" cy="168" r="14" fill="#1C2128" stroke="#F3EEE3" stroke-width="4"/>
  <circle cx="126" cy="168" r="14" fill="#1C2128" stroke="#F3EEE3" stroke-width="4"/>
  <circle cx="182" cy="168" r="14" fill="#1C2128" stroke="#F3EEE3" stroke-width="4"/>

  <!-- headlight accent -->
  <circle cx="196" cy="144" r="4" fill="#FF5A1F"/>
</svg>
